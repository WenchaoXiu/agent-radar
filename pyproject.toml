[project]
name = "agent-radar"
version = "0.1.0"
description = "Daily GitHub star rankings for AI Agents, MCP, Skills and Harness projects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.46.0",
    "playwright>=1.64.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
agent-radar = "agent_radar.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

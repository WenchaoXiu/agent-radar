queries:
  precise:          # 作为提示传给 LLM（通常相关），最终以 LLM 判断为准
    - topic:ai-agents
    - topic:ai-agent
    - topic:llm-agent
    - topic:autonomous-agents
    - topic:multi-agent
    - topic:agentic-ai
    - topic:agent-framework
    - topic:coding-agent
    - topic:mcp
    - topic:model-context-protocol
    - topic:mcp-server
    - topic:mcp-client
    - topic:mcp-tools
    - topic:claude-skills
    - topic:agent-skills
    - topic:claude-code-skills
    - topic:agent-harness
    - topic:claude-code
    - topic:codex-cli
  broad:            # 需要 LLM 判断相关性
    - topic:agents
    - topic:agent
    - topic:skills
    - topic:harness
    - '"ai agent" in:description'
    - '"mcp server" in:description'
    - '"agent skills" in:description'
    - '"agent harness" in:description'
thresholds:
  min_stars: 100
  new_repo_days: 30
boards:
  total: 100
  daily: 50
  weekly: 50
  new: 50
  category: 10      # 分类榜每个分类显示的数量
exclude:
  forks: true
  archived: true
  repos: []          # 手动黑名单
llm:
  enabled: true
  # effort: low | medium | high，作为 reasoning_effort 传给中转站；留空则不传
  classify: { model: "claude-sonnet-5-5", effort: low }
  agent:    { model: "claude-opus-5-5",   effort: high }
  writer:   { model: "claude-opus-5-5",   effort: medium }
  classify_batch_size: 1      # 每次调用分类的仓库数
  classify_workers: 4         # 并发调用数
  readme_chars: 20000         # README 清理后截取的字符数，0 表示不读 README
  refresh_days: 30            # 已分类仓库超过这么多天才重新分类
  refresh_per_run: 20         # 每次运行最多重新分类的过期仓库数，新仓库不受限
